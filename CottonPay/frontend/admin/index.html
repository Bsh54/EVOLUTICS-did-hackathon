<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CottonPay — Administration (enrôlement)</title>
<style>
:root{--cp-blue:#2554B0;--cp-blue-dark:#1C4090;--cp-gold:#B8863B;--cp-ink:#14202E;--cp-muted:#8A94A6;--cp-border:#D8DEE7;--cp-canvas:#F7F8FA;--cp-danger:#C0392B;--cp-success:#2E7D52;--font:Arial,Helvetica,'Segoe UI',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--cp-canvas);color:var(--cp-ink);min-height:100vh;padding:24px;}
.wrap{max-width:820px;margin:0 auto;}
h1{font-size:22px;margin-bottom:4px;}
.sub{color:var(--cp-muted);font-size:14px;margin-bottom:24px;}
.card{background:#fff;border:1px solid var(--cp-border);border-radius:12px;padding:24px;margin-bottom:20px;}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--cp-ink);}
input,select{width:100%;height:48px;border:1px solid var(--cp-border);border-radius:8px;padding:0 12px;font-size:15px;font-family:inherit;margin-bottom:16px;background:#fff;color:var(--cp-ink);}
input:focus,select:focus{outline:none;border-color:var(--cp-blue);}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.btn{border:none;border-radius:8px;height:50px;padding:0 22px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-primary{background:var(--cp-blue);color:#fff;width:100%;}
.btn-primary:hover{background:var(--cp-blue-dark);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.msg{font-size:13px;margin-top:8px;min-height:18px;}
.msg.err{color:var(--cp-danger);}
.msg.ok{color:var(--cp-success);}
.result{text-align:center;border-top:1px solid var(--cp-border);margin-top:20px;padding-top:20px;display:none;}
.result img{width:240px;height:240px;border:1px solid var(--cp-border);border-radius:10px;padding:10px;background:#fff;}
.result .who{font-weight:700;margin-bottom:12px;}
.result .link{font-size:12px;color:var(--cp-blue);word-break:break-all;margin-top:10px;}
.hidden{display:none;}
.hint{font-size:12px;color:var(--cp-muted);margin-top:-8px;margin-bottom:16px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Administration — Enrôlement des membres</h1>
  <p class="sub">Espace réservé. Émettez le credential d'un chef, puis remettez-lui son QR à scanner une fois.</p>

  <!-- Étape 0 : clé admin -->
  <div class="card" id="keyCard">
    <label for="adminKey">Clé administrateur</label>
    <input type="password" id="adminKey" placeholder="Entrez la clé admin" autocomplete="off">
    <button class="btn btn-primary" onclick="unlock()">Déverrouiller</button>
    <div class="msg err" id="keyMsg"></div>
  </div>

  <!-- Étape 1 : formulaire -->
  <div class="card hidden" id="formCard">
    <label for="coop">Coopérative</label>
    <select id="coop" onchange="onCoopChange()"></select>

    <label for="member">Membre connu (optionnel)</label>
    <select id="member" onchange="onMemberChange()"><option value="">— Saisie manuelle —</option></select>
    <div class="hint">Choisissez un membre pré-enregistré pour remplir automatiquement, ou saisissez à la main.</div>

    <div class="row">
      <div>
        <label for="npi">NPI</label>
        <input type="text" id="npi" placeholder="5000000000000001">
      </div>
      <div>
        <label for="name">Nom complet</label>
        <input type="text" id="name" placeholder="Issa Bio">
      </div>
    </div>

    <label for="role">Rôle</label>
    <select id="role"><option value="chef">Chef de coopérative</option><option value="secretaire">Secrétaire</option></select>

    <button class="btn btn-primary" id="submitBtn" onclick="enroll()">Émettre le credential</button>
    <div class="msg" id="formMsg"></div>

    <div class="result" id="result">
      <div class="who" id="resWho"></div>
      <img id="resQr" alt="QR d'enrôlement">
      <div class="link" id="resLink"></div>
    </div>
  </div>
</div>

<script>
let ADMIN_KEY = '';
let COOPS = [];

async function unlock(){
  const key = document.getElementById('adminKey').value.trim();
  const msg = document.getElementById('keyMsg');
  msg.textContent = '';
  try{
    const res = await fetch('/api/admin/coops', { headers:{ 'x-admin-key': key } });
    if(!res.ok) throw new Error('Clé invalide');
    const data = await res.json();
    ADMIN_KEY = key;
    COOPS = data.coops || [];
    document.getElementById('keyCard').classList.add('hidden');
    document.getElementById('formCard').classList.remove('hidden');
    fillCoops();
  }catch(e){ msg.textContent = e.message || 'Erreur'; }
}

function fillCoops(){
  const sel = document.getElementById('coop');
  sel.innerHTML = COOPS.map(c=>`<option value="${c.id}">${c.name}${c.commune?' — '+c.commune:''}</option>`).join('');
  onCoopChange();
}

function currentCoop(){ return COOPS.find(c=>c.id===document.getElementById('coop').value); }

function onCoopChange(){
  const c = currentCoop();
  const sel = document.getElementById('member');
  const members = c ? c.members : [];
  sel.innerHTML = '<option value="">— Saisie manuelle —</option>' +
    members.map((m,i)=>`<option value="${i}">${m.name} (${m.npi})</option>`).join('');
  document.getElementById('npi').value=''; document.getElementById('name').value='';
}

function onMemberChange(){
  const c = currentCoop();
  const idx = document.getElementById('member').value;
  if(idx==='' || !c) return;
  const m = c.members[Number(idx)];
  document.getElementById('npi').value = m.npi;
  document.getElementById('name').value = m.name;
  document.getElementById('role').value = m.role || 'chef';
}

async function enroll(){
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('formMsg');
  const npi = document.getElementById('npi').value.trim();
  const name = document.getElementById('name').value.trim();
  const cooperative_id = document.getElementById('coop').value;
  const role = document.getElementById('role').value;
  msg.className='msg'; msg.textContent='';
  if(!npi || !cooperative_id){ msg.className='msg err'; msg.textContent='NPI et coopérative requis.'; return; }
  btn.disabled=true; btn.textContent='Émission en cours…';
  try{
    const res = await fetch('/api/admin/enroll', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-key':ADMIN_KEY },
      body: JSON.stringify({ npi, name, cooperative_id, role })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Échec');
    const qr = data.invitationQr || (data.invitationUrl
      ? 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(data.invitationUrl) : '');
    document.getElementById('resWho').textContent = `${name || npi} — ${cooperative_id}`;
    document.getElementById('resQr').src = qr;
    document.getElementById('resLink').textContent = data.shortUrl || '';
    document.getElementById('result').style.display='block';
    msg.className='msg ok'; msg.textContent='Credential émis. Le chef scanne ce QR une seule fois.';
  }catch(e){ msg.className='msg err'; msg.textContent=e.message; }
  finally{ btn.disabled=false; btn.textContent='Émettre le credential'; }
}
</script>
</body>
</html>
